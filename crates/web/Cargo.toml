[package]
name = "crucible-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Loopback web camera. GET proxy, backlog, chat. Read-only POST /act/<verb> spawns that verb and waits. POST /act/go still spawns go as a process group."

[dependencies]
crucible-contract = { path = "../contract" }
crucible-http = { path = "../http" }
serde_json = "1"
