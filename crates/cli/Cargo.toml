[package]
name = "crucible-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Working-mode binary crucible (go/status/debrief/stats/serve; --version from VERSION)"

[[bin]]
name = "crucible"
path = "src/main.rs"

[dependencies]
crucible-contract = { path = "../contract" }
crucible-http = { path = "../http" }
crucible-kernel = { path = "../kernel" }

[dev-dependencies]
crucible-contract = { path = "../contract" }
serde_json = "1"
