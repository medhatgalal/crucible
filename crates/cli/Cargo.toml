[package]
name = "crucible-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Product binary crucible (working-mode and guided verbs; --version from VERSION)"

[[bin]]
name = "crucible"
path = "src/main.rs"

[dependencies]
crucible-contract = { path = "../contract" }
crucible-guided = { path = "../guided" }
crucible-http = { path = "../http" }
crucible-kernel = { path = "../kernel" }
crucible-room = { path = "../room" }
crucible-web = { path = "../web" }

[dev-dependencies]
crucible-contract = { path = "../contract" }
serde_json = "1"
