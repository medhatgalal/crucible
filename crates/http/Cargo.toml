[package]
name = "crucible-http"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "GET-only loopback serve (/walk /stats /health); no POST /go"

[dependencies]
crucible-contract = { path = "../contract" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
